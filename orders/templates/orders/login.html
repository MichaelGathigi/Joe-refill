{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Joe Refill</title>
    <link rel="icon" type="image/png" href="{% static 'images/favicon.png' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css">
    <style>
        body {
            background: #f8f9fa;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .login-box {
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .login-box img {
            width: 80px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<div class="login-box">
    <a href="{% url 'home' %}"><img src="{% static 'images/refill.png' %}" alt="Joe Refill logo"></a>
    <h2 class="mb-4">Login to Your Account</h2>

    {% for message in messages %}
    <div class="alert alert-{{ message.tags }} py-2">{{ message }}</div>
    {% endfor %}

    <form method="POST" novalidate>
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">
        <div class="mb-3">
            <input type="text" name="username" class="form-control" placeholder="Email address or username"
                   value="{{ form.username.value|default:'' }}" autocomplete="username" required autofocus>
        </div>
        <div class="mb-3">
            <input type="password" name="password" class="form-control" placeholder="Password"
                   autocomplete="current-password" required>
        </div>
        <div class="mb-3 form-check text-start">
            <input type="checkbox" class="form-check-input" id="remember" name="remember" value="1" checked>
            <label class="form-check-label" for="remember">Remember Me</label>
        </div>
        <button type="submit" class="btn btn-primary w-100">Login</button>
    </form>

    <div class="mt-3">
        Don't have an account?
        <a href="{% url 'register' %}{% if next %}?next={{ next|urlencode }}{% endif %}">Sign Up</a>
    </div>
    <div class="mt-2"><a href="{% url 'home' %}" class="text-muted small">&larr; Back to home</a></div>
</div>

</body>
</html>
